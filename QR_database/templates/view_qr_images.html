<!-- Bootstrap 5 CSS -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QR Viewer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">QR Viewer</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="/upload/">Upload GDS Files</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/inputs/">Upload Sample Files</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/view/1/">View QR Grid</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
<h2>Images with QR code at ({{ row }}, {{ col }})</h2>

<div style="display: flex; flex-wrap: wrap; gap: 10px;">
  {% for image in images %}
    <div>
      <img src="/media/samples/id={{ image.gds_file_id }}/{{ image.file_name }}"
           alt="{{ image.file_name }}"
           style="width: 800px; border: 1px solid #ccc;" />
      <p>{{ image.file_name }}</p>
    </div>
  {% endfor %}
</div>

<a href="/view/{{ gds_file_id }}/">Back to QR Grid</a>
</body>
</html>
