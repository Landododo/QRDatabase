<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Selector and File Upload</title>
    <style>
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }
        select, input[type="file"], button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
        #drop_zone {
        border: 5px solid rgb(0, 0, 0);
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 5px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="/">QR Viewer</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
          </button>
      
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="/upload/">Upload GDS Files</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/inputs/">Upload Sample Files</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/view/1/">View QR Grid</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    <div class="container">
        <h1>Upload Documents</h1>
        
        <!-- Document Selector -->
        <form id="uploadForm" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <label for="document-select">Select a Document:</label>
            <select id="document-select" name="document-select" required>
                <option value="" disabled selected>Select an option</option>
                {% for file in file_list %}
                <option value={{file.id}}>{{file.file_name}}</option>
                {% endfor %}
            </select>

            <!-- Multiple File Upload -->
            <label for="file-upload">Upload Files:</label>
            <input type="file" id="file-upload" name="file_field" multiple required>

            <!-- Drop Zone -->
            <div
                id="drop_zone"
                ondrop="dropHandler(event);"
                ondragover="dragOverHandler(event);">
                <p>Drag one or more files to this <i>drop zone</i> or select them manually.</p>
            </div>
            <!-- Submit Button -->
            <button name = "submit" type="submit">Submit</button>
            <button name = "submit and debug" type="submit">Submit and Debug</button>
        </form>
    </div>

    <script>
        // Form submission logic
        document.getElementById("uploadForm").addEventListener("submit", (e) => {
            const selectedDocument = document.getElementById("document-select").value;
            const files = document.getElementById("file-upload").files;

            if (!selectedDocument) {
                e.preventDefault();
                alert("Please select a document from the dropdown list.");
                return;
            }

            if (files.length === 0) {
                e.preventDefault();
                alert("Please upload at least one file.");
                return;
            }
            // Determine which button was clicked
            const debug = e.submitter.name === "submit and debug"; // true if debug button, false otherwise

            // Add a hidden input to send the debug value
            const debugInput = document.createElement("input");
            debugInput.type = "hidden";
            debugInput.name = "debug";
            debugInput.value = debug;
            document.getElementById("uploadForm").appendChild(debugInput);
            alert("Form submitted successfully!");
        });
        // Handle drag-and-drop logic
        function dragOverHandler(ev) {
            ev.preventDefault();
            ev.dataTransfer.dropEffect = "copy"; // Show the copy icon
        }
        function dropHandler(ev) {
            // Prevent default behavior (Prevent file from being opened)
            ev.preventDefault();

            const fileInput = document.getElementById("file-upload");
            const dt = ev.dataTransfer;
            const files = dt.files;

            if (files.length > 0) {
                const fileList = Array.from(fileInput.files); // Get existing files

                // Append new files from drop event
                for (let i = 0; i < files.length; i++) {
                    fileList.push(files[i]);
                }

                // Create a new DataTransfer to add all files
                const dataTransfer = new DataTransfer();
                fileList.forEach((file) => dataTransfer.items.add(file));

                // Assign the combined files back to the input
                fileInput.files = dataTransfer.files;

                alert(`${files.length} file(s) added successfully!`);
            }
        }
    </script>
</body>
</html>
