<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QR Grid Viewer</title>
  <label for="document-select">Select a GDS File:</label>
    <select name="document-select" id="document-select" required>
        {% for file in file_list %}
        <option value="{{ file.id }}"
                data-rows="{{ file.qrs_per_col }}"
                data-cols="{{ file.qrs_per_row }}"
                {% if file.id == 3 %}selected{% endif %}>
          {{ file.file_name }}
        </option>
      {% endfor %}
    </select>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      font-family: sans-serif;
    }

    #container {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      background: #f0f0f0;
      cursor: grab;
    }

    #grid {
      position: absolute;
      display: grid;
      grid-template-columns: repeat(60, 100px);
      grid-auto-rows: 100px;
      gap: 2px;
      transform-origin: top left;
    }

    .cell {
      border: 1px solid #999;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      user-select: none;
    }
  </style>
</head>
<body>

<div id="container">
  <div id="grid"></div>
</div>


<script>
    const grid = document.getElementById("grid");
    const select = document.getElementById("document-select");
    const selectedOption = select.options[select.selectedIndex];
    const rows = selectedOption.getAttribute("data-rows");
    const cols = selectedOption.getAttribute("data-cols");
    // const rows = 20;
    // const cols = 40;
    //System.log(rows)
    // Generate cells
    function buildGrid(rows, cols) {
    grid.innerHTML = "";  // Clear existing grid
    grid.style.display = "grid";
    grid.style.gridTemplateColumns = `repeat(${cols}, 100px)`;
    grid.style.gridAutoRows = "100px";
    grid.style.gap = "2px";

    for (let row = rows - 1; row > 0; row--) {
      for (let col = 0; col < cols; col++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.col = col;
        cell.dataset.row = row;
        cell.textContent = `(${row}, ${col})`;
        grid.appendChild(cell);
      }
    }
  }
  // Handle selection changes
  select.addEventListener("change", function () {
    const selectedOption = this.options[this.selectedIndex];
    const rows = parseInt(selectedOption.getAttribute("data-rows"), 10);
    const cols = parseInt(selectedOption.getAttribute("data-cols"), 10);
    buildGrid(rows, cols);
  });

  // Optional: Build grid for initial selection
  window.addEventListener("DOMContentLoaded", () => {
    const selectedOption = select.options[select.selectedIndex];
    const rows = parseInt(selectedOption.getAttribute("data-rows"), 10);
    const cols = parseInt(selectedOption.getAttribute("data-cols"), 10);
    buildGrid(rows, cols);
  });

    // for (let row = 0; row < rows; row++) {
    //     for (let col = 0; col < cols; col++) {
    //         const cell = document.createElement("div");
    //         cell.className = "cell";
    //         cell.dataset.row = row;
    //         cell.dataset.col = col;
    //         cell.textContent = `(${row}, ${col})`; // ✅ Add row and col label
    //         grid.appendChild(cell);
    //     }
    // }
  
    // Zoom and pan logic
    let scale = 1;
    let offsetX = 0;
    let offsetY = 0;
    let isDragging = false;
    let dragStartX, dragStartY;
    let startMouseX, startMouseY;
  
    const container = document.getElementById("container");
  
    container.addEventListener("wheel", (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.1 : 0.1;
      scale = Math.min(Math.max(0.2, scale + delta), 4);
      updateTransform();
    });
  
    container.addEventListener("mousedown", (e) => {
      isDragging = true;
      container.style.cursor = "grabbing";
      dragStartX = offsetX;
      dragStartY = offsetY;
      startMouseX = e.clientX;
      startMouseY = e.clientY;
    });
  
    container.addEventListener("mouseup", (e) => {
      container.style.cursor = "grab";
      if (!isDragging) return;
  
      const distX = Math.abs(e.clientX - startMouseX);
      const distY = Math.abs(e.clientY - startMouseY);
      const dragDistance = Math.sqrt(distX * distX + distY * distY);
  
      // If not a drag, treat it as a click
      if (dragDistance < 5) {
        const target = e.target;
        if (target.classList.contains("cell")) {
          const row = target.dataset.row;
          const col = target.dataset.col;
          window.location.href = `/view_qr/${row}/${col}/`;
          //alert(`Clicked QR ${row}, ${col}`);
        }
      }
  
      isDragging = false;
    });
  
    container.addEventListener("mousemove", (e) => {
      if (isDragging) {
        offsetX = dragStartX + (e.clientX - startMouseX);
        offsetY = dragStartY + (e.clientY - startMouseY);
        updateTransform();
      }
    });
  
    function updateTransform() {
      grid.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
    }
  </script>

</body>
</html>
