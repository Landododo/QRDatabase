<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Grid</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .grid-container {
            position: relative;
            width: 600px;
            height: 600px;
            overflow: hidden;
            border: 2px solid #ccc;
            margin: 20px auto;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            width: 100%;
            height: 100%;
            transform-origin: center;
            transition: transform 0.3s ease;
        }
        .cell {
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
        }
        .cell.highlighted {
            background-color: yellow;
        }
        .controls {
            text-align: center;
            margin: 10px 0;
        }
        .zoom-info {
            margin-top: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button onclick="zoomIn()">Zoom In</button>
        <button onclick="zoomOut()">Zoom Out</button>
        <p class="zoom-info">Zoom Level: <span id="zoom-level">1x</span></p>
    </div>
    <div class="grid-container" id="grid-container">
        <div class="grid" id="grid">
            <!-- Grid cells generated dynamically -->
        </div>
    </div>
    <script>
        const grid = document.getElementById("grid");
        const zoomLevelDisplay = document.getElementById("zoom-level");
        let zoomLevel = 1;

        // Generate a grid of 10x10 cells
        const rows = 10;
        const cols = 10;

        for (let i = 0; i < rows; i++) {
            for (let j = 0; j < cols; j++) {
                const cell = document.createElement("div");
                cell.classList.add("cell");
                cell.textContent = `${i},${j}`;
                cell.dataset.row = i;
                cell.dataset.col = j;

                // Add click event to highlight the cell
                cell.addEventListener("click", () => {
                    highlightCell(cell);
                });

                grid.appendChild(cell);
            }
        }

        // Zoom in the grid
        function zoomIn() {
            zoomLevel += 0.2;
            grid.style.transform = `scale(${zoomLevel})`;
            updateZoomInfo();
        }

        // Zoom out the grid
        function zoomOut() {
            zoomLevel = Math.max(0.4, zoomLevel - 0.2); // Prevent zooming out too much
            grid.style.transform = `scale(${zoomLevel})`;
            updateZoomInfo();
        }

        // Update zoom level display
        function updateZoomInfo() {
            zoomLevelDisplay.textContent = `${zoomLevel.toFixed(1)}x`;
        }

        // Highlight a cell
        function highlightCell(cell) {
            // Remove highlight from all cells
            document.querySelectorAll(".cell").forEach(c => c.classList.remove("highlighted"));

            // Highlight the clicked cell
            cell.classList.add("highlighted");
        }
    </script>
</body>
</html>
